stages:
  - test
  - benchmark
  - stability

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - apt-get update -qq && apt-get install -y -qq redis-server python3-venv
  - redis-server --daemonize yes
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install pytest pytest-cov numpy scipy redis

# ============================================================
# 1. 单元测试（必须通过）
# ============================================================
unit-tests:
  stage: test
  script:
    - pytest tests/test_linucb_p0.py tests/test_model_router.py -v --cov=core --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  only:
    - merge_requests
    - main
    - develop

# ============================================================
# 2. 性能基准测试（定时或手动触发）
# ============================================================
performance-benchmark:
  stage: benchmark
  script:
    - python benchmark_linucb.py > benchmark_output.txt 2>&1
    - cat benchmark_output.txt
  artifacts:
    paths:
      - benchmark_output.txt
    expire_in: 30 days
  only:
    - schedules
    - web  # 允许手动触发
  when: manual  # 需要手动启动（除非是定时触发）

# ============================================================
# 3. 数值稳定性测试（每周一运行）
# ============================================================
numeric-stability:
  stage: stability
  script:
    - python test_numeric_stability.py > stability_report.txt 2>&1
    - cat stability_report.txt
    # 检查是否通过（条件数 < 1e12）
    - |
      if grep -q "✅ 所有检查通过" stability_report.txt; then
        echo "✅ 数值稳定性测试通过"
      else
        echo "❌ 数值稳定性测试失败"
        exit 1
      fi
  artifacts:
    paths:
      - stability_report.txt
    expire_in: 30 days
  only:
    - schedules
  except:
    -web  # 不在手动触发时运行（避免重复）
  
# ============================================================
# 4. 代码质量检查（可选）
# ============================================================
code-quality:
  stage: test
  script:
    - pip install pylint mypy
    - pylint core/*.py || true  # 不阻塞 pipeline
    - mypy core/*.py || true
  allow_failure: true  # 允许失败
  only:
    - merge_requests
    - main
