name: WorkBuddy CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每天 UTC 2:00 运行性能基准（仅 main 分支）
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  # ============================================================
  # 1. 单元测试（必须通过）
  # ============================================================
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov numpy scipy redis
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run unit tests with coverage
      run: |
        pytest tests/test_linucb_p0.py tests/test_model_router.py \
          --cov=core --cov-report=xml --cov-report=term
    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests

  # ============================================================
  # 2. 性能基准测试（仅 main 分支定时/手动）
  # ============================================================
  performance-benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install numpy scipy redis
    - name: Run performance benchmark
      run: python benchmark_linucb.py
    - name: Store benchmark result
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark_output.txt

  # ============================================================
  # 3. 数值稳定性测试（每周运行一次）
  # ============================================================
  numeric-stability:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1'
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install numpy scipy redis
    - name: Run numeric stability test
      run: python test_numeric_stability.py
    - name: Archive stability report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stability-report
        path: stability_report.json
